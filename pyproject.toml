[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-semantic-o2c"
version = "1.0.0"
description = "Enterprise Order-to-Cash semantic layer with RDF, SHACL, SPARQL, FAISS and FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "rdflib>=7.0,<8.0",
    "pyshacl>=0.25,<1.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.8,<3.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0,<6.0",
    "faiss-cpu>=1.8,<2.0",
]
neo4j = ["neo4j>=5.20,<7.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
